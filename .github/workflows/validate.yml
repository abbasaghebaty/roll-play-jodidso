name: Validate
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --experimental-default-type=module --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Run pure rules and import-path tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
