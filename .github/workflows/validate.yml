name: Validate
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project tools
        run: npm install --no-package-lock
      - name: Apply D1 migrations to a fresh local database
        run: |
          rm -rf .wrangler/state
          npm run db:migrate:local
      - name: Verify migrations are already applied on a second run
        run: |
          npm run db:migrate:local
          npx wrangler d1 migrations list anime-rpg --local
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --experimental-default-type=module --check "$file"
          done < <(find src -type f -name '*.js' -print0)
      - name: Run pure rules and import-path tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
